<style>
@font-face {
  font-family: 'ErasDemi';
  src: url('eras-demi-itc.ttf');
}

:root{
  --gold-main:#D4AF37;
  --gold-soft:#FFF6DC;
  --gold-dark:#9C7A1E;
  --green-btn:#43A047;
  --save-bg:#8B5A00;
  --save-text:#FFD700;
}

body{
  margin:0;
  font-family: Arial, sans-serif;
  background:url('bgimage.jpg') center/cover fixed no-repeat;
}

.overlay{
  backdrop-filter: blur(6px);
  background:rgba(255,248,230,.92);
  min-height:100vh;
}

.wrapper{
  max-width:430px;
  margin:0 auto;
  background:#ffffff;
  border-radius:24px;
  box-shadow:0 25px 60px rgba(0,0,0,.28);
  overflow:hidden;
}

/* Ticker */
.ticker{
  background:#000;
  color:var(--gold-main);
  font-weight:700;
  padding:8px;
  white-space:nowrap;
  overflow:hidden;
}
.ticker span{
  display:inline-block;
  animation:scroll 15s linear infinite;
}
@keyframes scroll{
  from{transform:translateX(100%)}
  to{transform:translateX(-100%)}
}

/* Banner */
.banner{
  height:220px;
  background:url('bannerimage.png') center/cover no-repeat;
  position:relative;
}

/* DP */
.dp{
  position:absolute;
  bottom:-55px;
  width:100%;
  display:flex;
  justify-content:center;
}
.dp img{
  width:110px;
  height:110px;
  border-radius:50%;
  border:6px solid #fff;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
}

/* Content */
.content{
  padding:80px 18px 120px;
  text-align:center;
}

/* Brand */
.brand{
  font-family:'ErasDemi';
  font-size:28px;
  color:var(--gold-main);
  animation:glow 2s infinite alternate;
}
@keyframes glow{
  from{ text-shadow:0 0 4px var(--gold-main); }
  to{ text-shadow:0 0 14px #FFD700; }
}

.tagline{
  font-style:italic;
  font-weight:600;
  margin:10px 0;
  color:#4b3a14;
}

/* Language + Theme */
.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:12px 0 22px;
}
.control-btn{
  padding:8px 14px;
  border-radius:20px;
  background:#000;
  color:var(--gold-main);
  font-weight:700;
}

/* Ratings */
.section-title{
  font-weight:900;
  margin:12px 0;
  color:#000;
}
.ratings{
  display:flex;
  gap:10px;
}
.rate{
  flex:1;
  background:var(--gold-soft);
  border:2px solid var(--gold-main);
  border-radius:14px;
  padding:12px;
  font-weight:700;
  color:#000;
}

/* Action buttons */
.actions{
  display:flex;
  gap:10px;
  margin:16px 0;
}
.actions a{
  flex:1;
  padding:14px;
  border-radius:14px;
  background:var(--green-btn);
  font-weight:800;
  color:#fff;
  text-decoration:none;
}

/* Website button */
.website-btn{
  display:block;
  margin:14px 0;
  padding:14px;
  border-radius:16px;
  background:linear-gradient(135deg,#E6C15A,#C9A227);
  color:#000;
  font-weight:900;
  text-decoration:none;
}

/* Social */
.social{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.social a{
  padding:12px;
  border:2px solid var(--gold-main);
  border-radius:14px;
  font-weight:700;
  color:#000;
  background:#fff;
  text-decoration:none;
}

/* Address */
.address{
  margin-top:20px;
  background:var(--gold-soft);
  border:2px solid var(--gold-main);
  border-radius:16px;
  padding:14px;
  text-align:left;
  font-size:14px;
}

/* QR */
.qr{
  margin-top:22px;
  background:#000;
  border:4px solid #FFD700;
  border-radius:18px;
  padding:16px;
  color:#FFD700;
  font-family:'ErasDemi';
  box-shadow:0 0 18px rgba(255,215,0,.6);
}

/* Floating buttons */
.float-save{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  background:var(--save-bg);
  color:var(--save-text);
  padding:20px;
  width:90%;
  max-width:420px;
  border-radius:18px;
  font-weight:900;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.float-web{
  position:fixed;
  bottom:86px;
  right:16px;
  background:#000;
  color:var(--gold-main);
  padding:14px 16px;
  border-radius:50%;
}
</style>
