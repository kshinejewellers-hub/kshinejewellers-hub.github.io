*{

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
}

body{
  margin:0;

.container{

.card{

.header{

.header p{

}

.btn-primary{

  background:#1e7e34;
  color:#fff;
  text-align:center;
  padding:14px;
  border-radius:10px;
  text-decoration:none;
  font-weight:600;
  margin:18px;
}

.list a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 18px;
  text-decoration:none;
  color:var(--dark);
  border-top:1px solid #eee;
}

.list a:hover{
  background:#f6f4ef;
}

.icon{
  width:28px;
  text-align:center;
  font-size:18px;
  color:var(--gold);
}

.footer{
  text-align:center;
  padding:14px;
  font-size:13px;
  color:#777;
}
</style>
