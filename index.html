<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>K-SHINE JEWELLERS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
@font-face {
  font-family: 'ErasITC';
  src: url('eras-itc-regular.ttf') format('truetype');
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'ErasITC', Arial, sans-serif;
  background: linear-gradient(
    rgba(0,0,0,.35),
    rgba(0,0,0,.35)
  ), url('bannerimage.jpg') no-repeat center/cover;
  min-height:100vh;
}

.card{
  max-width:420px;
  margin:30px auto;
  background:rgba(255,255,255,.95);
  border-radius:22px;
  box-shadow:0 25px 60px rgba(0,0,0,.35);
  overflow:hidden;
}

.cover img{
  width:100%;
  display:block;
}

.dp{
  text-align:center;
  margin-top:-55px;
}

.dp img{
  width:110px;
  height:110px;
  border-radius:50%;
  border:5px solid #fff;
  background:#fff;
}

h1{
  text-align:center;
  margin:10px 0 5px;
  letter-spacing:3px;
  font-weight:700;
}

.tagline{
  text-align:center;
  color:#b8962e;
  font-size:14px;
}

.btn-main{
  display:block;
  margin:18px auto;
  width:85%;
  padding:14px;
  border-radius:30px;
  text-align:center;
  background:linear-gradient(135deg,#0f6b3f,#2fa86b);
  color:#fff;
  font-weight:700;
  text-decoration:none;
  box-shadow:0 8px 18px rgba(0,0,0,.3);
}

.section{
  padding:18px;
}

.section h3{
  text-align:center;
  color:#b8962e;
  letter-spacing:2px;
  margin-bottom:15px;
}

/* Ratings */
.ratings{
  display:flex;
  gap:12px;
}

.rate-box{
  flex:1;
  border:2px solid #d2b04c;
  border-radius:14px;
  padding:12px;
  text-align:center;
  font-weight:600;
}

/* Slider */
.slider{
  overflow:hidden;
  margin-top:10px;
}

.slider-track{
  display:flex;
  width:200%;
  animation: slide 18s linear infinite;
}

.slider-track img{
  width:180px;
  height:260px;
  margin-right:14px;
  border-radius:18px;
  object-fit:cover;
  box-shadow:0 10px 25px rgba(0,0,0,.3);
}

@keyframes slide{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}

/* Social */
.social{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.social a{
  border:2px solid #d2b04c;
  border-radius:14px;
  padding:14px;
  text-align:center;
  text-decoration:none;
  color:#000;
  font-weight:600;
}

/* Address */
.addr{
  border:2px solid #d2b04c;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
  font-size:14px;
}

/* Floating button */
.floating{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  width:85%;
  background:#0f6b3f;
  color:#fff;
  text-align:center;
  padding:14px;
  border-radius:30px;
  font-weight:700;
  text-decoration:none;
  box-shadow:0 8px 20px rgba(0,0,0,.35);
}
</style>
</head>

<body>

<div class="card">

<div class="cover">
  <img src="bannerimage.jpg">
</div>

<div class="dp">
  <img src="dpimage.png">
</div>

<h1>K-SHINE JEWELLERS</h1>
<div class="tagline">
Your trusted Jewellery Brand for Gold, Diamond & Silver Jewellery in Jammu
</div>
