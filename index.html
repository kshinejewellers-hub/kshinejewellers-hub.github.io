<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>K-SHINE JEWELLERS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
@font-face{
  font-family:'ErasITC';
  src:url('eras-itc-regular.ttf') format('truetype');
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'ErasITC',Arial,sans-serif;
  background:
    linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
    url('bannerimage.jpg') center/cover fixed;
  color:#111;
}

/* SECTION */
section{
  padding:70px 16px;
}

/* HERO */
.hero{
  text-align:center;
  color:#fff;
}

.hero img.cover{
  width:100%;
  border-radius:26px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

.dp{
  margin-top:-70px;
}
.dp img{
  width:140px;
  height:140px;
  border-radius:50%;
  border:5px solid #fff;
  box-shadow:0 20px 50px rgba(0,0,0,.6);
}

h1{
  letter-spacing:4px;
  margin:18px 0 8px;
}

.tagline{
  font-size:15px;
  background:linear-gradient(90deg,#d6b45c,#fff,#d6b45c);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 4s linear infinite;
}

@keyframes shine{
  from{background-position:-200px}
  to{background-position:200px}
}

/* SAVE CONTACT */
.save{
  margin:30px auto;
  width:90%;
  padding:18px;
  text-align:center;
  border-radius:40px;
  color:#fff;
  font-weight:700;
  text-decoration:none;
  background:
    linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.3)),
    url('bannerimage.jpg') center/cover;
  border:2px solid #d6b45c;
  box-shadow:0 16px 40px rgba(0,0,0,.5);
}

/* WHITE SECTIONS */
.card{
  background:#fff;
  border-radius:30px;
  padding:30px 20px;
  max-width:480px;
  margin:auto;
  box-shadow:0 30px 70px rgba(0,0,0,.45);
}

h2{
  text-align:center;
  color:#b8962e;
  letter-spacing:2px;
  margin-bottom:24px;
}

/* RATINGS */
.ratings{
  display:flex;
  gap:14px;
}
.rate{
  flex:1;
  padding:18px;
  border-radius:20px;
  border:2px solid #d6b45c;
  background:#fff7df;
  text-align:center;
  font-weight:700;
}

/* SLIDER */
.slider{
  display:flex;
  gap:16px;
  overflow-x:auto;
}
.slider img{
  width:200px;
  border-radius:20px;
  box-shadow:0 16px 40px rgba(0,0,0,.4);
}

/* SOCIAL */
.social{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.social a{
  border:2px solid #d6b45c;
  border-radius:20px;
  padding:14px;
  text-decoration:none;
  color:#111;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px;
}
.social img{width:26px}

/* MAP */
.map iframe{
  width:100%;
  height:300px;
  border-radius:20px;
  border:2px solid #d6b45c;
}
</style>
</head>

<body>

<section class="hero">
  <img src="bannerimage.jpg" class="cover">
  <div class="dp"><img src="dpimage.png"></div>
  <h1>K-SHINE JEWELLERS</h1>
  <div class="tagline">
    Your trusted Jewellery Brand for Gold, Diamond & Silver Jewellery in Jammu
  </div>
  <a class="save" href="contact.vcf">💾 Save Contact</a>
</section>

<section>
  <div class="card">
    <h2>CUSTOMER RATINGS</h2>
    <div class="ratings">
      <div class="rate">★★★★★<br>Gandhi Nagar<br>1000+ Reviews</div>
      <div class="rate">★★★★★<br>Janipur<br>1200+ Reviews</div>
    </div>
  </div>
</section>

<section>
  <div class="card">
    <h2>JEWELLERY COLLECTION</h2>
    <div class="slider">
      <img src="gallery/jewel1.jpg">
      <img src="gallery/jewel2.jpg">
      <img src="gallery/jewel3.jpg">
      <img src="gallery/jewel4.jpg">
    </div>
  </div>
</section>

<section>
  <div class="card">
    <h2>JOIN SOCIAL MEDIA</h2>
    <div class="social">
      <a href="https://chat.whatsapp.com/Jfk8HhjvAZM1wYqUBK6zCS">
        <img src="icons/whatsapp.svg"> Join WhatsApp Group
      </a>
      <a href="https://www.instagram.com/kshine_jewellers">
        <img src="icons/instagram.svg"> Instagram
      </a>
      <a href="https://www.facebook.com/kshinejewelers">
        <img src="icons/facebook.svg"> Facebook Page
      </a>
      <a href="https://youtube.com/@k-shinejewellers1365">
        <img src="icons/youtube.svg"> YouTube
      </a>
    </div>
  </div>
</section>

<section>
  <div class="card map">
    <h2>OUR SHOWROOMS</h2>
    <iframe src="https://maps.google.com/maps?q=K-Shine+Jewellers+Gandhi+Nagar+Jammu&output=embed"></iframe>
    <br><br>
    <iframe src="https://maps.google.com/maps?q=K-Shine+Jewellers+Janipur+Jammu&output=embed"></iframe>
  </div>
</section>

</body>
</html>
