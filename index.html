<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KSHINE JEWELLERS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ==================================================
STYLE 1 – FONTS
================================================== -->
<style>
@font-face{font-family:'ErasDemi';src:url('eras-demi-itc.ttf');}
@font-face{font-family:'FuturaBold';src:url('futuraboldbt.ttf');}

/* ==================================================
STYLE 2 – COLOUR SYSTEM
================================================== */
:root{
  --gold:#d4af37;
  --gold-dark:#8a6a10;
  --gold-light:#fff3c4;
  --green:#8fd19e;
}

/* ==================================================
STYLE 3 – BODY & BACKGROUND
================================================== */
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:url('bgimage.jpg') center/cover fixed no-repeat;
}

/* ==================================================
STYLE 4 – MAIN WRAPPER
================================================== */
.wrapper{
  max-width:430px;
  margin:10px auto 160px;
  background:#fff;
  border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  overflow:hidden;
}

/* ==================================================
STYLE 5 – TOP SCROLLER
================================================== */
.scroller{
  background:#000;
  color:#ffd700;
  font-size:13px;
  font-style:italic;
  padding:6px 0;
  white-space:nowrap;
  overflow:hidden;
}
.scroller span{
  display:inline-block;
  padding-left:100%;
  animation:scroll 12s linear infinite;
}
@keyframes scroll{
  to{transform:translateX(-100%);}
}

/* ==================================================
STYLE 6 – BANNER & DP
================================================== */
.banner{
  height:230px;
  background:url('bannerimage.png') center/cover no-repeat;
  position:relative;
}
.dp{
  position:absolute;
  bottom:-55px;
  width:100%;
  display:flex;
  justify-content:center;
}
.dp img{
  width:110px;
  height:110px;
  border-radius:50%;
  border:6px solid #fff;
}

/* ==================================================
STYLE 7 – CONTENT
================================================== */
.content{
  padding:75px 16px 24px;
  text-align:center;
}

/* ==================================================
STYLE 8 – BRAND NAME
================================================== */
.brand{
  font-family:'ErasDemi';
  font-size:26px;
  background:linear-gradient(90deg,#7a5c00,#ffd700,#fff6c0,#ffd700,#7a5c00);
  background-size:300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:goldFlow 4s linear infinite;
}
@keyframes goldFlow{to{background-position:300%;}}

/* ==================================================
STYLE 9 – TAGLINE
================================================== */
.tag{
  font-style:italic;
  color:#666;
  animation:tagGlowPulse 3s ease-in-out infinite;
}
@keyframes tagGlowPulse{
  50%{opacity:1;text-shadow:0 0 8px rgba(212,175,55,.4);}
}

/* ==================================================
STYLE 10 – GOOGLE RATINGS
================================================== */
.ratings{display:flex;gap:12px;margin-top:12px;}
.rate{
  flex:1;
  background:var(--gold-light);
  border:3px solid var(--gold);
  border-radius:18px;
  padding:10px;
}
.rate .stars{
  font-size:18px;
  background:linear-gradient(120deg,#5e4300,#ffd700,#fff3b0);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:starZoom 2.4s infinite;
}
@keyframes starZoom{50%{transform:scale(1.18);}}
.rate .score,.rate .place{
  font-family:'FuturaBold';
  font-weight:900;
}

/* ==================================================
STYLE 11 – BUTTONS
================================================== */
.btn{
  display:block;
  margin:10px 0;
  padding:14px;
  border-radius:18px;
  font-family:'FuturaBold';
  border:3px solid var(--gold);
  color:#000;
  text-decoration:none;
}

/* ==================================================
STYLE 12 – ACTIONS
================================================== */
.actions{display:flex;gap:10px;}
.action{flex:1;background:var(--green);}

/* ==================================================
STYLE 13 – SOCIAL GRID
================================================== */
.social{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.social a{
  background:var(--gold-light);
  border:2px solid var(--gold);
  padding:10px;
  border-radius:14px;
  font-family:'FuturaBold';
}

/* ==================================================
STYLE 14 – TRUSTED CUSTOMER SLIDER
================================================== */
.trusted-box{
  background:#000;
  border-radius:22px;
  padding:18px;
  margin:24px auto;
}
.trusted-title{
  color:#fff;
  font-family:'FuturaBold';
  margin-bottom:14px;
}
.trusted-slider{overflow:hidden;}
.trusted-track{
  display:flex;
  gap:14px;
  animation:trustedScroll 40s linear infinite;
}
.trusted-card{width:140px;}
.trusted-card img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:18px;
  border:3px solid var(--gold);
}
@keyframes trustedScroll{
  to{transform:translateX(-50%);}
}

/* ==================================================
STYLE 15 – FLOATING BUTTONS
================================================== */
.floating{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:12px;
  width:92%;
  max-width:420px;
  z-index:99999;
}
.float-btn{
  flex:1;
  padding:14px;
  border-radius:22px;
  font-family:'FuturaBold';
  border:3px solid var(--gold);
  background:linear-gradient(135deg,#fff2a8,#ffd700,#8a6a10);
}
.share-float{
  position:fixed;
  right:16px;
  bottom:90px;
  padding:12px 20px;
  border-radius:30px;
  font-family:'FuturaBold';
  border:3px solid var(--gold);
  background:linear-gradient(135deg,#fff2a8,#ffd700,#8a6a10);
  z-index:99999;
}
.whatsapp-group-float{
  position:fixed;
  left:16px;
  bottom:90px;
  padding:12px 18px;
  border-radius:30px;
  font-family:'FuturaBold';
  border:3px solid var(--gold);
  background:linear-gradient(135deg,#fff2a8,#ffd700,#8a6a10);
  z-index:99999;
}
</style>
</head>

</body>
</html>
