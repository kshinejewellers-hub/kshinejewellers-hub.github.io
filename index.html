<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>K-SHINE JEWELLERS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f1ec;
}

.card{
  max-width:420px;
  margin:20px auto;
  background:#ffffff;
  border-radius:22px;
  box-shadow:0 20px 45px rgba(0,0,0,.25);
  overflow:hidden;
}

/* BANNER */
.banner{
  height:200px;
  background:url('bannerimage.png') center/cover no-repeat;
  position:relative;
}

/* DP */
.dp{
  position:absolute;
  bottom:-45px;
  width:100%;
  display:flex;
  justify-content:center;
}
.dp img{
  width:95px;
  height:95px;
  border-radius:50%;
  border:5px solid #fff;
  background:#fff;
}

/* CONTENT */
.content{
  padding:60px 18px 25px;
  text-align:center;
}

/* BRAND */
.brand{
  font-size:26px;
  font-weight:800;
  color:#b8962e;
}
.tag{
  color:#8a6a12;
  margin:6px 0 18px;
}

/* BUTTON */
.btn{
  display:block;
  background:#2e7d32;
  color:#fff;
  padding:14px;
  border-radius:12px;
  text-decoration:none;
  font-weight:700;
  margin-bottom:20px;
}

/* RATINGS */
.ratings{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}
.rate{
  flex:1;
  border:1px solid #d4af37;
  border-radius:12px;
  padding:10px;
  background:#fff9e6;
  font-size:14px;
}

/* LINKS */
.list a{
  display:block;
  padding:14px;
  border-bottom:1px solid #eee;
  text-decoration:none;
  color:#333;
  font-weight:600;
}

/* SOCIAL GRID */
.social{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}
.social a{
  padding:12px;
  border-radius:10px;
  background:#fff;
  border:1px solid #e0c36f;
  text-decoration:none;
  color:#333;
  font-weight:600;
}

/* QR */
.qr{
  margin-top:20px;
  padding:14px;
  background:#000;
  color:#d4af37;
  border-radius:12px;
  font-weight:700;
}
</style>
</head>

<body>

<div class="card">

<div class="banner">
  <div class="dp">
    <img src="dpimage.png" alt="K-Shine Jewellers">
  </div>
</div>

<div class="content">

<div class="brand">K-SHINE JEWELLERS</div>
<div class="tag">Gold • Diamond • Silver Jewellery</div>

<a class="btn" href="contact.vcf">💾 Save Contact</a>

<div class="ratings">
  <div class="rate">⭐ 4.9<br><strong>Gandhi Nagar</strong></div>
  <div class="rate">⭐ 4.8<br><strong>Janipur</strong></div>
</div>

  <a href="https://wa.me/919622212879">💬 WhatsApp Us</a>
</div>

<div class="social">
  <a href="https://chat.whatsapp.com/Jfk8HhjvAZM1wYqUBK6zCS">🟢 WhatsApp Group</a>
  <a href="https://www.instagram.com/kshine_jewellers">📸 Instagram</a>

  <a href="https://youtube.com/@k-shinejewellers1365">▶️ YouTube</a>

</div>
</div>

</body>
</html>
