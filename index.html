<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>KSHINE JEWELLERS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ==================================================
STYLE 1 – FONTS
================================================== -->
<style>
@font-face{font-family:'ErasDemi';src:url('eras-demi-itc.ttf');}
@font-face{font-family:'FuturaBold';src:url('futuraboldbt.ttf');}

/* ==================================================
STYLE 2 – COLOUR SYSTEM
================================================== */
:root{
  --gold:#d4af37;
  --gold-dark:#8a6a10;
  --gold-light:#fff3c4;
  --green:#8fd19e;
  --brown:#5b3a00;
}

/* ==================================================
STYLE 3 – BODY & BACKGROUND
================================================== */
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:url('bgimage.jpg') center/cover fixed no-repeat;
}

/* ==================================================
STYLE 4 – MAIN WRAPPER
================================================== */
.wrapper{
  max-width:430px;
  margin:10px auto 140px;
  background:#fff;
  border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  overflow:hidden;
}

/* ==================================================
STYLE 5 – TOP SCROLLER
================================================== */
.scroller{
  background:#000;
  color:#ffd700;
  font-size:13px;
  font-style:italic;
  padding:6px 0;
  white-space:nowrap;
  overflow:hidden;
}
.scroller span{
  display:inline-block;
  padding-left:100%;
  animation:scroll 9s linear infinite;
}
@keyframes scroll{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

/* ==================================================
STYLE 6 – BANNER & DP
================================================== */
.banner{
  height:230px;
  background:url('bannerimage.png') center/cover no-repeat;
  position:relative;
}
.dp{
  position:absolute;
  bottom:-55px;
  width:100%;
  display:flex;
  justify-content:center;
}
.dp img{
  width:110px;
  height:110px;
  border-radius:50%;
  border:6px solid #fff;
}

/* ==================================================
STYLE 7 – CONTENT AREA
================================================== */
.content{
  padding:75px 16px 24px;
  text-align:center;
}

/* ==================================================
STYLE 8 – BRAND NAME
================================================== */
.brand{
  font-family:'ErasDemi';
  font-size:26px;
  background:linear-gradient(90deg,#7a5c00,#ffd700,#fff6c0,#ffd700,#7a5c00);
  background-size:300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:goldFlow 4s linear infinite;
}
@keyframes goldFlow{
  0%{background-position:0%}
  100%{background-position:300%}
}

/* ==================================================
STYLE 9 – TAGLINE
================================================== */
.tag{
  font-style:italic;
  font-weight:600;
  color:#666;
  margin:10px 0 16px;
  animation:tagGlowPulse 3.2s ease-in-out infinite;
}
@keyframes tagGlowPulse{
  0%{opacity:.6}
  50%{opacity:1;text-shadow:0 0 8px rgba(212,175,55,.35)}
  100%{opacity:.6}
}

/* ==================================================
STYLE 10 – RATINGS TITLE
================================================== */
.rating-title{
  font-family:'ErasDemi';
  margin:14px 0;
}

/* ==================================================
STYLE 11 – GOOGLE RATINGS
================================================== */
.ratings{
  display:flex;
  gap:12px;
}
.rate{
  flex:1;
  background:var(--gold-light);
  border:3px solid var(--gold);
  border-radius:18px;
  padding:10px;
  cursor:pointer;
}
.rate small{font-size:11px;font-style:italic;}
.rate .stars{
  font-size:18px;
  background:linear-gradient(120deg,#5e4300,#ffd700,#fff3b0,#ffd700,#5e4300);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:starZoom 2.4s infinite;
}
@keyframes starZoom{
  0%{transform:scale(1)}
  50%{transform:scale(1.18)}
  100%{transform:scale(1)}
}
.rate .score,
.rate .place{
  font-family:'FuturaBold';
  font-weight:900;
}
.rate .reviews{font-style:italic;}

/* ==================================================
STYLE 12 – COMMON BUTTONS
================================================== */
.btn{
  display:block;
  margin:10px 0;
  padding:14px;
  border-radius:18px;
  font-family:'FuturaBold';
  font-weight:900;
  color:#000;
  text-decoration:none;
  border:3px solid var(--gold);
}

/* ==================================================
STYLE 13 – CALL / WHATSAPP
================================================== */
.actions{
  display:flex;
  gap:10px;
}
.action{flex:1;background:var(--green);}

/* ==================================================
STYLE 14 – WEBSITE BUTTON
================================================== */
.website-btn{
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
}

/* ==================================================
STYLE 15 – SOCIAL MEDIA GRID
================================================== */
.social{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.social a{
  background:var(--gold-light);
  border:2px solid var(--gold);
  border-radius:14px;
  padding:10px;
  font-family:'FuturaBold';
  color:#000;
  text-decoration:none;
}

/* ==================================================
STYLE 16 – ADDRESS
================================================== */
.address{
  background:#fff4c2;
  border:2px solid var(--gold);
  border-radius:16px;
  padding:14px;
}

/* ==================================================
STYLE 17 – QR
================================================== */
.qr{
  background:#000;
  border:4px solid var(--gold);
  border-radius:18px;
  padding:10px;
}
.qr img{width:65%;margin:auto;display:block;}
.qr p{color:var(--gold);font-size:11px;}

/* ==================================================
STYLE 18 – FLOATING BUTTONS
================================================== */
.floating{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  width:92%;
  max-width:420px;
  z-index:9999;
}
.float-btn{
  flex:1;
  background:linear-gradient(135deg,#5b3a00,#b08d1a);
  color:#ffd700;
  padding:14px;
  border-radius:18px;
  font-family:'FuturaBold';
  border:3px solid var(--gold);
  text-decoration:none;
}

/* ==================================================
STYLE 18A – FLOATING SHARE BUTTON (FIXED)
================================================== */
.share-float{
  position:fixed;
  bottom:90px;
  right:16px;
  z-index:10001;
  padding:12px 20px;
  border-radius:28px;
  background:linear-gradient(135deg,#fff6cf,#ffd700,#8a6a10);
  border:3px solid var(--gold);
  font-family:'FuturaBold';
  font-size:14px;
  font-weight:900;
  color:#000;
  box-shadow:0 10px 28px rgba(0,0,0,.45);
}
.share-float:active{transform:scale(.95);}
</style>

<!-- ==================================================
SCRIPT – SAVE CONTACT
================================================== -->
<script>
function saveContact(){
const vcf=`BEGIN:VCARD
VERSION:3.0
FN:KSHINE JEWELLERS
ORG:KSHINE JEWELLERS
TEL:+919622212879
URL:https://kshinejewellers.com
END:VCARD`;
const blob=new Blob([vcf],{type:'text/vcard'});
const link=document.createElement('a');
link.href=URL.createObjectURL(blob);
link.download='KSHINE-JEWELLERS.vcf';
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
}
</script>

<!-- ==================================================
SCRIPT – SHARE
================================================== -->
<script>
function shareCard(){
if(navigator.share){
navigator.share({
title:'KSHINE JEWELLERS',
text:'✨ KSHINE JEWELLERS – Premium Gold, Diamond & Silver Jewellery',
url:window.location.href
});
}else{
alert('Sharing not supported');
}
}
</script>

</head>

<body>

<div class="scroller"><span>◆ K-Shine Jewellers ◆ Premium Gold • Diamond • Silver ◆</span></div>

<div class="wrapper">
<div class="banner"><div class="dp"><img src="dpimage.png"></div></div>
<div class="content">

<div class="brand">KSHINE JEWELLERS</div>
<div class="tag">Your trusted Jewellery Brand in Jammu.</div>

<div class="rating-title">5 Star Customer Ratings</div>

<div class="ratings">
<div class="rate"><small>Tap to open Google Maps</small><div class="stars">★★★★★</div><div class="score">4.9</div><div class="place">Gandhi Nagar</div><div class="reviews">1000+ Reviews</div></div>
<div class="rate"><small>Tap to open Google Maps</small><div class="stars">★★★★★</div><div class="score">5.0</div><div class="place">Janipur</div><div class="reviews">1260+ Reviews</div></div>
</div>

<a href="javascript:void(0)" onclick="saveContact()" class="btn">💾 Save Contact</a>

</div>
</div>

<div class="floating">
<a href="https://kshinejewellers.com" class="float-btn">🌐 Website</a>
<a href="javascript:void(0)" onclick="saveContact()" class="float-btn">💾 Save Contact</a>
</div>

<!-- FLOATING SHARE BUTTON -->
<button class="share-float" onclick="shareCard()">🔗 Share</button>

</body>
</html>
