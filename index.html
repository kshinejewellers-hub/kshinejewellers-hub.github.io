<html lang="en">
<head>
<meta charset="UTF-8">
<title>K-Shine Jewellers | Luxury Digital Card</title>

body{
  margin:0;
  font-family:"Poppins", Arial, sans-serif;
  background:

    url('bg-gold.jpg') center/cover no-repeat fixed;
}

.wrapper{
  max-width:420px;
  margin:30px auto;
  background:rgba(255,255,255,.92);
  border-radius:22px;
  box-shadow:0 25px 60px rgba(0,0,0,.45);
  overflow:hidden;
}

/* BANNER */
.banner{
  height:200px;
  background:url('bannerimage.png') center/cover no-repeat;
  position:relative;
}

/* DP */
.dp{
  position:absolute;
  bottom:-45px;
  width:100%;
  display:flex;
  justify-content:center;
}
.dp img{
  width:100px;
  height:100px;
  border-radius:50%;
  border:5px solid #fff;
  box-shadow:0 8px 20px rgba(0,0,0,.4);
}

/* CONTENT */
.content{
  padding:60px 18px 26px;
  text-align:center;
}

/* BRAND NAME */
.brand{
  font-size:24px;
  font-weight:700;
  background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 1px 12px rgba(212,175,55,.6);
}
.tagline{
  color:#9c7c2d;
  font-size:14px;
  margin-bottom:16px;
}

/* SAVE CONTACT */
.save{
  display:block;
  background:linear-gradient(135deg,#1b5e20,#43a047);
  color:#fff;
  padding:15px;
  border-radius:12px;
  font-weight:600;
  text-decoration:none;
  margin-bottom:18px;
  transition:.3s;
}
.save:active{transform:scale(.97);}

/* RATINGS */
.ratings{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}
.rate{
  flex:1;
  background:#fff8e1;
  border:1px solid #e6c76f;
  border-radius:14px;
  padding:10px;
  font-size:13px;
}
.rate strong{
  display:block;
  color:#8a6d00;
}
.stars{
  color:#d4af37;
  font-size:15px;
}

/* SECTION TITLE */
.section{
  margin:18px 0 10px;
  font-weight:700;
  letter-spacing:1px;
  color:#7a5b00;
}

/* SOCIAL GRID */
.social-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.social{
  padding:12px;
  border-radius:12px;
  background:linear-gradient(135deg,#fff,#f8f3e8);
  border:1px solid #e2c97c;
  font-weight:600;
  color:#333;
  text-decoration:none;
  transition:.25s;
}
.social:active{
  background:#d4af37;
  color:#fff;
}
