<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>K-Shine Jewellers | Digital Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family: "Segoe UI", Arial, sans-serif;
  background:#f4f3ef;
}

.card{
  max-width:420px;
  margin:25px auto;
  background:#fff;
  border-radius:20px;
  box-shadow:0 15px 35px rgba(0,0,0,.18);
  overflow:hidden;
}

.banner{
  height:190px;
  background:url('bannerimage.png') center/cover no-repeat;
  position:relative;
}

.logo{
  position:absolute;
  bottom:-45px;
  left:50%;
  transform:translateX(-50%);
}

.logo img{
  width:90px;
  height:90px;
  border-radius:50%;
  border:4px solid #fff;
  background:#fff;
}

.content{
  padding:65px 20px 25px;
  text-align:center;
}

h1{
  margin:6px 0;
  font-size:22px;
  letter-spacing:.5px;
}

.tagline{
  color:#b08d3c;
  font-size:14px;
  margin-bottom:15px;
}

.save{
  display:block;
  background:linear-gradient(135deg,#2e7d32,#43a047);
  color:#fff;
  padding:14px;
  border-radius:10px;
  text-decoration:none;
  font-weight:600;
  margin-bottom:15px;
}

.rating{
  font-size:14px;
  margin-bottom:18px;
}

.list a{
  display:flex;
  align-items:center;
  padding:14px 10px;
  border-top:1px solid #eee;
  text-decoration:none;
  color:#333;
  font-size:15px;
}

.list a:hover{background:#faf7f2;}

.icon{
  width:26px;
  margin-right:12px;
  fill:#b08d3c;
}

.lang{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:15px 0;
}

.lang button{
  border:none;
  background:#eee;
  padding:6px 12px;
  border-radius:20px;
  cursor:pointer;
}

.qr{
  margin-top:18px;
  padding:12px;
  background:#111;
  color:#fff;
  border-radius:10px;
  text-decoration:none;
  display:block;
}
</style>
</head>

<body>

<div class="card">

  <div class="banner">
    <div class="logo">
      <img src="dpimage.png">
    </div>
  </div>

  <div class="content">

    <h1 id="name">K-SHINE JEWELLERS</h1>
    <div class="tagline" id="tag">Gold • Diamond • Silver Jewellery</div>

    <a class="save" href="contact.vcf">💾 Save Contact</a>

    <!-- GOOGLE RATING -->
    <div class="rating">
      ⭐⭐⭐⭐⭐ <b>4.8</b> (1,200+ Reviews)
    </div>

    <!-- LANGUAGE SWITCH -->
    <div class="lang">
      <button onclick="en()">English</button>
      <button onclick="hi()">हिंदी</button>
    </div>

    <div class="list">
