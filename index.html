/* COVER IMAGE */
.cover{
  width:100%;

/* PROFILE CARD */
.card{
  max-width:380px;

/* NAME BEHIND DP */
.name-bg{

  font-weight:700;

  opacity:0.15;
  z-index:0;
}

/* DP IMAGE */
.dp{

  height:110px;
  border-radius:50%;

  background:#fff;

  z-index:1;
}

h1{

}

.subtitle{
  color:#c9a24d;
  font-weight:500;
  font-size:14px;
}

/* BUTTONS */
.btn{
  display:block;
  margin:12px 0;
  padding:14px;
  border-radius:12px;
  text-decoration:none;
  font-weight:600;
  background:#c9a24d;
  color:#fff;
}

.btn.green{
  background:#2e7d32;
}

/* LIST */
.list a{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border-bottom:1px solid #eee;
  text-decoration:none;
  color:#333;
}

.list img{
  width:22px;
  height:22px;
}
